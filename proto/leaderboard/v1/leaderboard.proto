syntax = "proto3";

package parley.leaderboard.v1;

import "common/v1/types.proto";

service LeaderboardService {
  rpc GetLeaderboard(GetLeaderboardRequest) returns (GetLeaderboardResponse);
  rpc GetPlayerRank(GetPlayerRankRequest) returns (GetPlayerRankResponse);
}

enum LeaderboardType {
  LEADERBOARD_TYPE_UNSPECIFIED = 0;
  LEADERBOARD_TYPE_ELO = 1;
  LEADERBOARD_TYPE_WIN_RATE = 2;
  LEADERBOARD_TYPE_RANK_POINTS = 3;
}

message GetLeaderboardRequest {
  parley.common.v1.Game game = 1;
  string guild_id = 2;
  LeaderboardType type = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message LeaderboardEntry {
  string player_id = 1;
  string username = 2;
  int64 rank = 3;
  double score = 4;
  int32 matches = 5;
  int32 wins = 6;
  int32 losses = 7;
  float win_rate = 8;
}

message GetLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
  int64 total_count = 2;
}

message GetPlayerRankRequest {
  parley.common.v1.Game game = 1;
  string guild_id = 2;
  string player_id = 3;
  LeaderboardType type = 4;
}

message GetPlayerRankResponse {
  LeaderboardEntry entry = 1;
}
