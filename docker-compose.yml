name: parley

services:
  backend:
    image: ghcr.io/bake-computers/parley-engine:latest
    container_name: parley-backend

    restart: unless-stopped
    pull_policy: always
    init: true

    env_file:
      - ./.env

    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set in .env}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-}
      - STATS_CC_API_BASE_URL=${STATS_CC_API_BASE_URL:-}
      - STATS_CC_PROFILE_BATCH_SIZE=${STATS_CC_PROFILE_BATCH_SIZE:-}
      - STATS_CC_PROFILE_BATCH_DELAY_MS=${STATS_CC_PROFILE_BATCH_DELAY_MS:-}
      - ACCOUNT_DELETION_HMAC_SECRET=${ACCOUNT_DELETION_HMAC_SECRET}
      - MATCHMAKING_MODEL_R2_ACCOUNT_ID=${MATCHMAKING_MODEL_R2_ACCOUNT_ID:-}
      - MATCHMAKING_MODEL_R2_ACCESS_KEY_ID=${MATCHMAKING_MODEL_R2_ACCESS_KEY_ID:-}
      - MATCHMAKING_MODEL_R2_SECRET_ACCESS_KEY=${MATCHMAKING_MODEL_R2_SECRET_ACCESS_KEY:-}
      - MATCHMAKING_MODEL_R2_BUCKET=${MATCHMAKING_MODEL_R2_BUCKET:-}
      - MATCHMAKING_MODEL_R2_KEY=${MATCHMAKING_MODEL_R2_KEY:-}
      - MATCHMAKING_MODEL_R2_JURISDICTION=${MATCHMAKING_MODEL_R2_JURISDICTION:-}
      - MATCHMAKING_MIN_SEASON_MATCHES=${MATCHMAKING_MIN_SEASON_MATCHES:-}
      - MATCHMAKING_ROLE_BALANCE_WEIGHT=${MATCHMAKING_ROLE_BALANCE_WEIGHT:-}
      - MATCHMAKING_ROLE_COLLISION_WEIGHT=${MATCHMAKING_ROLE_COLLISION_WEIGHT:-}
      - AXIOM_TOKEN=${AXIOM_TOKEN:-}
      - AXIOM_DATASET=${AXIOM_DATASET:-}
      - AXIOM_ORG_ID=${AXIOM_ORG_ID:-}
      - AXIOM_EDGE=${AXIOM_EDGE:-}
      - BOT_OWNER_DISCORD_ID=${BOT_OWNER_DISCORD_ID:-}
      - MATCHMAKING_MODEL_R2_SHA256=${MATCHMAKING_MODEL_R2_SHA256:-}

    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:9090:9090"

    extra_hosts:
      - "postgres.host:host-gateway"

    networks:
      - postgres-clients

    mem_limit: 768m
    cpus: 2.0
    pids_limit: 256

    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  postgres-clients:
    external: true
    name: postgres-clients
