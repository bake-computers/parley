version: "3.8"

services:
  postgres:
    image: postgres:18
    container_name: parley_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parley}
      POSTGRES_DB: ${POSTGRES_DB:-parley}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal-net

  parley:
    image: ghcr.io/pactum-computer/parley-engine:latest
    container_name: parley-backend
    restart: always
    environment:
      - ENGINE_SERVICE_ADDR=${ENGINE_SERVICE_ADDR}
      - LOG_LEVEL=${LOG_LEVEL}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - RUN_MIGRATIONS=${RUN_MIGRATIONS}
      - DB_TLS=${DB_TLS}
      - ACCOUNT_DELETION_HMAC_SECRET=${ACCOUNT_DELETION_HMAC_SECRET}
    ports:
      - "127.0.0.1:50051:50051"
    networks:
      - internal-net
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  pgdata:

networks:
  internal-net:
    driver: bridge
