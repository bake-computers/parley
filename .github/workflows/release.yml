name: Release

# Every push to main cuts a GitHub Release from the commits since the previous
# tag. One commit in → one line in the release notes. The body also lists which
# Workers/engine need redeploying for this release (CI still auto-deploys edges
# on path changes; engine image push is separate).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          # Skip if this commit is already released (e.g. workflow re-run).
          if [[ -n "${previous}" ]]; then
            prev_sha="$(git rev-list -n 1 "${previous}")"
            if [[ "${prev_sha}" == "${GITHUB_SHA}" ]]; then
              echo "HEAD is already tagged as ${previous}; nothing to release."
              exit 0
            fi
          fi

          if [[ -n "${previous}" ]]; then
            range="${previous}..HEAD"
            previous_ref="${previous}"
          elif [[ -n "${BEFORE_SHA:-}" && ! "${BEFORE_SHA}" =~ ^0+$ ]]; then
            # First release: only the commits in this push, not entire history.
            range="${BEFORE_SHA}..HEAD"
            previous_ref="${BEFORE_SHA}"
          else
            range="${GITHUB_SHA}^!"
            previous_ref="$(git rev-parse "${GITHUB_SHA}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          commits_file="$(mktemp)"
          # Subject lines only, oldest first. Drop merges so a single landed
          # change shows up as that one conventional commit.
          git log "${range}" --reverse --no-merges --pretty=format:'%s' >"${commits_file}" || true
          printf '\n' >>"${commits_file}"

          if ! grep -q '[^[:space:]]' "${commits_file}"; then
            # Pure merge push with no non-merge commits in range.
            git log "${range}" --reverse --pretty=format:'%s' >"${commits_file}" || true
            printf '\n' >>"${commits_file}"
          fi

          # Drop empty lines.
          grep -v '^[[:space:]]*$' "${commits_file}" >"${commits_file}.clean" || true
          mv "${commits_file}.clean" "${commits_file}"

          if [[ ! -s "${commits_file}" ]]; then
            echo "No commits to release."
            rm -f "${commits_file}"
            exit 0
          fi

          commit_count="$(grep -c . "${commits_file}")"

          bump="patch"
          while IFS= read -r subject; do
            lower="$(printf '%s' "${subject}" | tr '[:upper:]' '[:lower:]')"
            # Conventional Commits: type!: / type(scope)!: or "breaking change"
            if [[ "${lower}" == *"breaking change"* || "${lower}" == *'!:'* ]]; then
              bump="major"
              break
            fi
            if [[ "${bump}" != "major" ]] && {
              [[ "${lower}" == feat:* ]] || [[ "${lower}" == feat\(* ]] || [[ "${lower}" == feat!* ]]
            }; then
              bump="minor"
            fi
          done <"${commits_file}"

          if [[ -z "${previous}" ]]; then
            case "${bump}" in
              major) next="v1.0.0" ;;
              minor) next="v0.1.0" ;;
              *) next="v0.0.1" ;;
            esac
          else
            ver="${previous#v}"
            IFS=. read -r major minor patch <<<"${ver}"
            major="${major:-0}"
            minor="${minor:-0}"
            patch="${patch:-0}"
            case "${bump}" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              *)
                patch=$((patch + 1))
                ;;
            esac
            next="v${major}.${minor}.${patch}"
          fi

          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "Tag ${next} already exists."
            rm -f "${commits_file}"
            exit 1
          fi

          changed_files="$(git diff --name-only "${previous_ref}" "${GITHUB_SHA}" || true)"
          needs_web=0
          needs_worker=0
          needs_docs=0
          needs_engine=0

          while IFS= read -r f; do
            [[ -z "${f}" ]] && continue
            case "${f}" in
              apps/web/*|packages/*|package.json|bun.lock|bun.lockb|tsconfig.base.json|vite.config.ts)
                needs_web=1
                needs_worker=1
                ;;
              apps/worker/*)
                needs_worker=1
                ;;
              apps/docs/*)
                needs_docs=1
                ;;
              go.mod|go.sum|cmd/*|internal/*|gen/*|migrations/*|Dockerfile|buf.yaml|buf.gen.yaml)
                needs_engine=1
                ;;
              proto/*)
                needs_web=1
                needs_worker=1
                needs_engine=1
                ;;
            esac
          done <<<"${changed_files}"

          notes="$(mktemp)"
          {
            echo "## Redeploy"
            echo
            if [[ "${needs_web}" -eq 0 && "${needs_worker}" -eq 0 && "${needs_docs}" -eq 0 && "${needs_engine}" -eq 0 ]]; then
              echo "No edge/engine paths changed — no redeploy required."
            else
              echo "Ship this release by redeploying:"
              echo
              [[ "${needs_worker}" -eq 1 ]] && echo "- **worker** → \`app.parley.bot\` (CI: Deploy Cloudflare Workers)"
              [[ "${needs_web}" -eq 1 ]] && echo "- **web** → \`parley.bot\` (CI: Deploy Cloudflare Workers)"
              [[ "${needs_docs}" -eq 1 ]] && echo "- **docs** → \`docs.parley.bot\` (CI: Deploy Cloudflare Workers)"
              [[ "${needs_engine}" -eq 1 ]] && echo "- **engine** → GHCR image \`parley-engine\` (CI: Deploy Engine; roll out on the origin host)"
            fi
            echo
            echo "## Changes"
            echo
            while IFS= read -r subject; do
              printf -- '- %s\n' "${subject}"
            done <"${commits_file}"
            echo
            echo "---"
            echo
            if [[ -n "${previous}" ]]; then
              echo "Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${next}"
            else
              echo "Commit: https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            fi
          } >"${notes}"

          echo "Creating ${next} (bump=${bump}, commits=${commit_count}, previous=${previous:-none})"
          cat "${notes}"

          gh release create "${next}" \
            --target "${GITHUB_SHA}" \
            --title "${next}" \
            --notes-file "${notes}"

          rm -f "${commits_file}" "${notes}"
