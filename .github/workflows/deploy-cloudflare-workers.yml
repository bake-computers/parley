name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "proto/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "turbo.json"
      - "oxfmt.config.ts"
      - "oxlint.config.ts"
      - "tsconfig.base.json"
      - "packages/tsconfig-base/**"
      - ".github/workflows/deploy-cloudflare-workers.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-workers-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  bridge:
    name: Deploy bridge (parley-bridge)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: production-bridge
      url: https://bridge.parley.bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Bun Install
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy bridge Worker
        working-directory: apps/bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

  landing-and-worker:
    name: Deploy ${{ matrix.app.name }}
    needs: bridge
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: ${{ matrix.app.env }}
      url: ${{ matrix.app.url }}
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: landing
            cwd: apps/landing
            env: production-landing
            url: https://parley.bot
          - name: worker
            cwd: apps/worker
            env: production-worker
            url: https://app.parley.bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Bun Install
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy ${{ matrix.app.name }} Worker
        working-directory: ${{ matrix.app.cwd }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy