name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "proto/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "turbo.json"
      - "oxfmt.config.ts"
      - "oxlint.config.ts"
      - "tsconfig.base.json"
      - "packages/tsconfig-base/**"
      - ".github/workflows/deploy-cloudflare-workers.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-workers-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: Detect changed apps
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      web: ${{ steps.filter.outputs.web }}
      worker: ${{ steps.filter.outputs.worker }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'proto/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'tsconfig.base.json'
              - 'turbo.json'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'proto/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'tsconfig.base.json'
              - 'turbo.json'
            docs:
              - 'apps/docs/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'turbo.json'

  web-and-worker:
    name: Deploy ${{ matrix.app.name }}
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch'
      || (matrix.app.name == 'web' && needs.changes.outputs.web == 'true')
      || (matrix.app.name == 'worker' && needs.changes.outputs.worker == 'true')
      || (matrix.app.name == 'docs' && needs.changes.outputs.docs == 'true')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: ${{ matrix.app.env }}
      url: ${{ matrix.app.url }}
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: web
            cwd: apps/web
            env: production-landing
            url: https://parley.bot
          - name: worker
            cwd: apps/worker
            env: production-worker
            url: https://app.parley.bot
          - name: docs
            cwd: apps/docs
            env: production-docs
            url: https://docs.parley.bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Bun Install
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy ${{ matrix.app.name }} Worker
        working-directory: ${{ matrix.app.cwd }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
