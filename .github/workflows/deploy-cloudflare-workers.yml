name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "proto/**"
      - "package.json"
      - "bun.lock"
      - "bun.lockb"
      - "turbo.json"
      - "oxfmt.config.ts"
      - "oxlint.config.ts"
      - "tsconfig.base.json"
      - "packages/tsconfig-base/**"
      - ".github/workflows/deploy-cloudflare-workers.yml"
      - ".github/workflows/deploy-app.yml"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-workers-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: Detect changed apps
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      web: ${{ steps.filter.outputs.web }}
      worker: ${{ steps.filter.outputs.worker }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'proto/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'tsconfig.base.json'
              - 'turbo.json'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'proto/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'tsconfig.base.json'
              - 'turbo.json'
            docs:
              - 'apps/docs/**'
              - 'package.json'
              - 'bun.lock'
              - 'bun.lockb'
              - 'turbo.json'

  web:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app-name: web
      cwd: apps/web
      environment: production-landing
      url: https://parley.bot
    secrets: inherit

  worker:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.worker == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app-name: worker
      cwd: apps/worker
      environment: production-worker
      url: https://app.parley.bot
    secrets: inherit

  docs:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app-name: docs
      cwd: apps/docs
      environment: production-docs
      url: https://docs.parley.bot
    secrets: inherit
