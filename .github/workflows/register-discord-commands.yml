name: Register Discord Commands

on:
  push:
    paths:
      - "apps/worker/src/register-commands.ts"
      - "apps/worker/src/interactions/**"
      - "packages/runtime/src/**"
      - ".github/workflows/register-discord-commands.yml"
  pull_request:
    paths:
      - "apps/worker/src/register-commands.ts"
      - "apps/worker/src/interactions/**"
      - "packages/runtime/src/**"
      - ".github/workflows/register-discord-commands.yml"
  workflow_dispatch:

concurrency:
  group: register-discord-commands-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  register:
    name: Register slash commands
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: production-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun Install
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # @parley/runtime main points at dist/ — source alone is not importable
      - name: Build runtime
        run: bun run --filter @parley/runtime build

      - name: Register Discord commands
        working-directory: apps/worker
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
        run: bun run register-commands
