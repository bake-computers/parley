name: Engine CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "gen/**"
      - "migrations/**"
      - "proto/**"
      - ".github/workflows/engine-ci.yml"

concurrency:
  group: engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vet and test engine-service
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate protobuf (Go)
        run: buf generate

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
