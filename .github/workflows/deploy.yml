name: Deploy Parley Bare-Metal

on:
  push:
    branches:
      - main
    paths:
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "gen/**"
      - "migrations/**"
      - "proto/**"
      - ".github/workflows/deploy.yml"

jobs:
  build-and-deploy:
    name: Build and deploy engine-service
    runs-on: blacksmith-2vcpu-ubuntu-2404
    environment:
      name: production-engine
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Generate protobuf (Go)
        run: buf generate

      - name: Verify and test
        run: |
          go vet ./...
          go test ./...

      - name: Build release binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o parley ./cmd/parley

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2222 -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Push Binary and Deploy
        env:
          TARGET_DIR: "/home/deployer/apps/parley"
          VERSION: "${{ github.sha }}"
        run: |
          scp -P 2222 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 parley deployer@${{ secrets.SERVER_HOST }}:$TARGET_DIR/releases/parley_$VERSION
          ssh -p 2222 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 deployer@${{ secrets.SERVER_HOST }} "export VERSION=$VERSION; bash $TARGET_DIR/deploy.sh"