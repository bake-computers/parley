name: Deploy Parley Bare-Metal

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-and-deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cache Protobuf Compiler
        id: cache-protoc
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/protoc
          key: ${{ runner.os }}-protoc-v25.1

      - name: Install Protobuf Compiler (Fallback)
        if: steps.cache-protoc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local/bin
          curl -sSL https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip -o protoc.zip
          unzip -q protoc.zip -d protoc_dist
          mv protoc_dist/bin/protoc ~/.local/bin/
          rm -rf protoc.zip protoc_dist

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/release/deps/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'proto/**/*.proto') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Compile Release Binary
        run: cargo build --release --locked --jobs 2
        env:
          RUSTFLAGS: "-C codegen-units=1"

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 2222 -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Push Binary and Deploy
        env:
          TARGET_DIR: "/home/deployer/apps/parley"
          VERSION: "${{ github.sha }}"
        run: |
          scp -P 2222 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 target/release/parley deployer@${{ secrets.SERVER_HOST }}:$TARGET_DIR/releases/parley_$VERSION
          ssh -p 2222 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 deployer@${{ secrets.SERVER_HOST }} "export VERSION=$VERSION; bash $TARGET_DIR/deploy.sh"
