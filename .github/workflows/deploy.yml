name: Deploy Parley Bare-Metal

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/**"

jobs:
  build-and-deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Protobuf Compiler (For prost/protox)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Compile Release Binary
        run: cargo build --release

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Note the -p 2222 flag here to scan the correct port
          ssh-keyscan -p 2222 -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Push Binary and Deploy
        env:
          TARGET_DIR: "/home/deployer/apps/parley"
          VERSION: "${{ github.sha }}"
        run: |
          # Capital -P 2222 for scp
          scp -P 2222 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 target/release/parley deployer@${{ secrets.SERVER_HOST }}:$TARGET_DIR/releases/parley_$VERSION

          # Lowercase -p 2222 for ssh
          ssh -p 2222 -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 deployer@${{ secrets.SERVER_HOST }} "export VERSION=$VERSION; bash $TARGET_DIR/deploy.sh"
