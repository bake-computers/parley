[package]
name = "parley"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "parley"
path = "src/main.rs"

[features]
default = []
mimalloc = ["dep:mimalloc"]

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# HTTP
reqwest = { version = "0.13.3", default-features = false, features = [
  "rustls",
  "gzip",
  "brotli",
  "json",
  "stream",
] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.11", features = [
  "trace",
  "cors",
  "compression-gzip",
  "compression-br",
  "timeout",
] }
hyper = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost = "0.14.3"
prost-types = "0.14.3"

# Errors / logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.8"
async-trait = "0.1"
once_cell = "1.20"
simd-json = "0.17"

# Env loading
dotenvy = "0.15"

# Database (async Diesel)
diesel = { version = "2.3.9", default-features = false, features = [
  "postgres",
  "serde_json",
  "chrono",
  "numeric",
  "uuid",
  "32-column-tables",
] }
diesel-async = { version = "0.9", features = ["postgres", "bb8"] }
diesel-derive-enum = { version = "2.1", features = ["postgres"] }
bb8 = "0.9.1"
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# TLS for the Postgres connection
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "1.0.7"

# Axiom logging
axiom-rs = "0.11.6"

# Parsing
regex = "1.11"
url = "2.5"

# Redis
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Crypto (GDPR deletion cooldown HMAC)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }

# Optional global allocator
mimalloc = { version = "0.1.51", optional = true }

[dev-dependencies]
wiremock = "0.6"

[build-dependencies]
prost-build = "0.14.3"
protox = "0.9.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
