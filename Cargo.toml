[package]
name = "parley"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "parley"
path = "src/main.rs"

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
engine = { path = "crates/engine" }
stats-scraper = { path = "crates/stats-scraper" }
brawl-stars = { path = "crates/brawl-stars" }
ocr = { path = "crates/ocr" }

axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
reqwest = { workspace = true }
dotenvy = { workspace = true }

prost = { workspace = true }
prost-types = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
async-trait = { workspace = true }

# Optional global allocator.
mimalloc = { version = "0.1", optional = true }

# Database (async Diesel + bb8 pool + embedded migrations)
diesel = { workspace = true }
diesel-async = { workspace = true }
diesel-derive-enum = { workspace = true }
bb8 = { workspace = true }
diesel_migrations = { workspace = true }
chrono = { workspace = true }
# diesel-async 0.5 forgets to pull the `async-await-macro` feature from
# futures-util, so its `try_join!` macro doesn't compile without this patch.
futures-util = { version = "0.3", features = ["std", "sink", "async-await-macro"] }
# TLS for the Postgres connection (managed DB providers require SSL).
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "0.26"

# Metrics
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
wiremock = { workspace = true }

[build-dependencies]
prost-build = { workspace = true }
protox = { workspace = true }

[workspace]
resolver = "2"
members = [
    "crates/engine",
    "crates/stats-scraper",
    "crates/brawl-stars",
    "crates/vessel",
    "crates/ocr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "json", "stream"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "compression-br", "timeout"] }
hyper = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Protobuf (pure-Rust parser via protox, no protoc needed)
prost = "0.13"
prost-types = "0.13"
prost-build = "0.13"
protox = "0.7"

# HTML / parsing
scraper = "0.23"
regex = "1.11"
url = "2.5"

# Image rendering
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"

# Errors / logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1.8"
async-trait = "0.1"
once_cell = "1.20"

# Env loading
dotenvy = "0.15"

# Database (async Diesel)
diesel = { version = "2.2", default-features = false, features = ["postgres", "serde_json", "chrono", "numeric", "32-column-tables"] }
diesel-async = { version = "0.5", features = ["postgres", "bb8"] }
diesel-derive-enum = { version = "2.1", features = ["postgres"] }
bb8 = "0.8"
diesel_migrations = { version = "2.2", features = ["postgres"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# Dev / testing
wiremock = "0.6"
tempfile = "3.14"
criterion = "0.5"

# Cryptography / verification
ed25519-dalek = { version = "2.1", features = ["std", "serde"] }

# Bloom filters
fastbloom = { version = "0.17", default-features = false, features = ["serde"] }

# Serialization / binary
bincode = "1.3"
hex = "0.4"

# CLI / progress
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
