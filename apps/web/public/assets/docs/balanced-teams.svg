<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="balanced-teams-title">
  <title id="balanced-teams-title">A Parley match card in Discord with two evenly balanced teams and their ratings</title>
  <rect width="720" height="420" rx="14" fill="#1e1f22"/>
  <circle cx="38" cy="36" r="14" fill="#5865f2"/>
  <text x="38" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">P</text>
  <text x="62" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f2f3f5">Parley</text>
  <rect x="118" y="27" width="36" height="17" rx="4" fill="#5865f2"/>
  <text x="136" y="39" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">APP</text>
  <rect x="22" y="62" width="676" height="336" rx="10" fill="#2b2d31"/>
  <text x="46" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#f2f3f5">Match found</text>
  <text x="46" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#949ba4">Teams built for even odds from everyone's Parley Rank.</text>
  <text x="46" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#c0c5ce">TEAM A</text>
  <text x="674" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#c0c5ce" text-anchor="end">TEAM B</text>
  <text x="360" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#949ba4" text-anchor="middle">VS</text>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#dbdfe4">
    <text x="46" y="186">V1PER.STORM</text>
    <text x="46" y="214">NOVA_RUSH</text>
    <text x="46" y="242">clutchless</text>
    <text x="46" y="270">BreachQueen</text>
    <text x="46" y="298">smoke.and.mirrors</text>
    <text x="674" y="186" text-anchor="end">IRON.SIGHTS</text>
    <text x="674" y="214" text-anchor="end">flashbangFred</text>
    <text x="674" y="242" text-anchor="end">kapitank</text>
    <text x="674" y="270" text-anchor="end">EchoDrop</text>
    <text x="674" y="298" text-anchor="end">wampei</text>
  </g>
  <g font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#949ba4">
    <text x="240" y="186" text-anchor="end">2,610</text>
    <text x="240" y="214" text-anchor="end">2,480</text>
    <text x="240" y="242" text-anchor="end">2,395</text>
    <text x="240" y="270" text-anchor="end">2,270</text>
    <text x="240" y="298" text-anchor="end">2,150</text>
    <text x="480" y="186">2,590</text>
    <text x="480" y="214">2,510</text>
    <text x="480" y="242">2,360</text>
    <text x="480" y="270">2,255</text>
    <text x="480" y="298">2,180</text>
  </g>
  <line x1="360" y1="170" x2="360" y2="306" stroke="#3f4147" stroke-width="1" stroke-dasharray="3 4"/>
  <rect x="46" y="330" width="628" height="10" rx="5" fill="#1e1f22"/>
  <rect x="46" y="330" width="314" height="10" rx="5" fill="#5865f2" opacity="0.85"/>
  <rect x="360" y="330" width="314" height="10" rx="5" fill="#c0c5ce" opacity="0.7"/>
  <circle cx="360" cy="335" r="7" fill="#f2f3f5"/>
  <text x="46" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#949ba4">Balance</text>
  <text x="674" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#c0c5ce" text-anchor="end">Even odds</text>
